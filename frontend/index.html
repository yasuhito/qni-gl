<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
    <title>Qni GL</title>
  </head>
  <body class="m-0">
    <div id="app" class="relative">
      <div
        class="fixed top-0 left-0 z-40 rounded-br-2xl bg-white drop-shadow-xl"
        id="menu-container"
      >
        <div class="relative inline-block h-10 w-10 p-1 text-left">
          <button
            aria-label="Menu"
            type="button"
            class="inline-flex h-full w-full items-center justify-center rounded-xl text-neutral-700 hover:bg-neutral-200 focus:outline-none"
            id="menu-button"
            aria-expanded="false"
            aria-haspopup="true"
            aria-controls="menu-dropdown"
          >
            <img src="/icons/menu.svg" alt="Menu" class="w-6 h-6" />
          </button>
          <div
            id="menu-dropdown"
            class="absolute left-0 mt-2 hidden w-56 origin-top-right divide-y divide-neutral-100 overflow-hidden rounded-xl bg-white shadow-lg ring-1 ring-neutral-300 focus:outline-none"
            role="menu"
            aria-orientation="vertical"
            aria-labelledby="menu-button"
            tabindex="-1"
          >
            <div class="py-1" role="none">
              <button class="text-neutral-700 block w-full px-4 py-2 text-sm flex items-center hover:bg-neutral-100" role="menuitem" tabindex="-1" id="menu-item-share">
                <img src="/icons/share.svg" alt="Share" class="w-5 h-5 flex-shrink-0 mr-2" />
                Share...
              </button>
            </div>
            <div class="py-1" role="none">
              <button
                class="text-neutral-700 w-full px-4 py-2 text-sm text-left flex items-center hover:bg-neutral-100"
                role="menuitem"
                tabindex="-1"
                id="quantum-algorithms"
                type="button"
                aria-expanded="false"
                aria-controls="quantum-algorithms"
              >
                <img
                  src="/icons/list.svg"
                  alt="Quantum Algorithms"
                  class="w-5 h-5 flex-shrink-0 mr-2"
                />
                Quantum Algorithms
                <img
                  src="/icons/chevron-down.svg"
                  class="ml-auto w-4 h-4"
                  alt="Chevron Down"
                />
              </button>
              <div
                id="quantum-algorithms-dropdown"
                class="flex-col gap-1 hidden"
              >
                <button
                  type="button"
                  class="text-neutral-700 w-full px-4 py-2 text-sm flex items-center hover:bg-neutral-100"
                  data-algo="chsh"
                >
                  Bell state generation
                </button>
                <button
                  type="button"
                  class="text-neutral-700 w-full px-4 py-2 text-sm flex items-center hover:bg-neutral-100"
                  data-algo="ghz"
                >
                  GHZ state generation
                </button>
                <button
                  type="button"
                  class="text-neutral-700 w-full px-4 py-2 text-sm flex items-center hover:bg-neutral-100"
                  data-algo="grover"
                >
                  Grover's algorithm
                </button>
              </div>
            </div>
            <div class="border-t border-neutral-200"></div>
            <div class="py-1" role="none">
              <button class="text-neutral-700 flex w-full items-center px-4 py-2 text-left text-sm hover:bg-neutral-100" role="menuitem" tabindex="-1" id="menu-item-shortcuts">
                <img src="/icons/keyboard.svg" alt="" class="mr-2 h-5 w-5 flex-shrink-0" />
                Keyboard shortcuts
              </button>
              <a href="https://qniapp.github.io/qni/" class="text-neutral-700 block px-4 py-2 text-sm flex items-center hover:bg-neutral-100" role="menuitem" tabindex="-1" id="menu-item-tutorial" target="_blank" rel="noopener noreferrer">
                <img src="/icons/tutorial.svg" alt="Tutorial" class="w-5 h-5 flex-shrink-0 mr-2" />
                 Tutorial (日本語)
              </a>
              <a href="https://github.com/yasuhito/qni-gl" class="text-neutral-700 block px-4 py-2 text-sm flex items-center hover:bg-neutral-100" role="menuitem" tabindex="-1" id="menu-item-github" target="_blank" rel="noopener noreferrer">
                <img src="/icons/github.svg" alt="GitHub" class="w-5 h-5 flex-shrink-0 mr-2" />
                 GitHub
              </a>
              <a href="https://x.com/qniapp" class="text-neutral-700 block px-4 py-2 text-sm flex items-center hover:bg-neutral-100" role="menuitem" tabindex="-1" id="menu-item-x" target="_blank" rel="noopener noreferrer">
                <img src="/icons/x.svg" alt="X" class="w-5 h-5 flex-shrink-0 mr-2" />
                 X
              </a>
            </div>
            <div class="border-t border-neutral-200"></div>
            <div class="py-1" role="none">
              <a href="#" class="text-red-500 block px-4 py-2 text-sm flex items-center hover:bg-neutral-100" role="menuitem" tabindex="-1" id="menu-item-clear-circuit">
                <img src="/icons/trash.svg" alt="Clear circuit" class="w-5 h-5 flex-shrink-0 mr-2" />
                 Clear circuit
              </a>
            </div>
          </div>
        </div>
      </div>
      <dialog id="shortcut-help-dialog" class="m-auto w-96 max-w-[calc(100vw-2rem)] rounded-xl border border-neutral-200 bg-white p-0 text-neutral-700 shadow-xl backdrop:bg-black/20">
        <div class="p-5 text-sm">
          <div class="mb-4 flex items-center justify-between">
            <h2 class="font-semibold">Keyboard shortcuts</h2>
            <button id="shortcut-help-close" type="button" aria-label="Close keyboard shortcuts" class="rounded-md bg-white text-gray-400 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
              <span class="sr-only">Close</span>
              <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
          <table class="w-full border-separate border-spacing-y-1.5">
            <tbody>
              <tr>
                <th scope="row" class="pr-4 text-left font-normal">Select all</th>
                <td class="whitespace-nowrap text-right text-neutral-500">Ctrl+A</td>
                <td data-shortcut-separator aria-hidden="true" class="px-2 text-center text-neutral-400">/</td>
                <td class="whitespace-nowrap text-neutral-500">⌘A</td>
              </tr>
              <tr>
                <th scope="row" class="pr-4 text-left font-normal">Cut</th>
                <td class="whitespace-nowrap text-right text-neutral-500">Ctrl+X</td>
                <td data-shortcut-separator aria-hidden="true" class="px-2 text-center text-neutral-400">/</td>
                <td class="whitespace-nowrap text-neutral-500">⌘X</td>
              </tr>
              <tr>
                <th scope="row" class="pr-4 text-left font-normal">Copy</th>
                <td class="whitespace-nowrap text-right text-neutral-500">Ctrl+C</td>
                <td data-shortcut-separator aria-hidden="true" class="px-2 text-center text-neutral-400">/</td>
                <td class="whitespace-nowrap text-neutral-500">⌘C</td>
              </tr>
              <tr>
                <th scope="row" class="pr-4 text-left font-normal">Paste</th>
                <td class="whitespace-nowrap text-right text-neutral-500">Ctrl+V</td>
                <td data-shortcut-separator aria-hidden="true" class="px-2 text-center text-neutral-400">/</td>
                <td class="whitespace-nowrap text-neutral-500">⌘V</td>
              </tr>
              <tr>
                <th scope="row" class="pr-4 text-left font-normal">Undo</th>
                <td class="whitespace-nowrap text-right text-neutral-500">Ctrl+Z</td>
                <td data-shortcut-separator aria-hidden="true" class="px-2 text-center text-neutral-400">/</td>
                <td class="whitespace-nowrap text-neutral-500">⌘Z</td>
              </tr>
              <tr>
                <th scope="row" class="pr-4 text-left align-top font-normal" rowspan="2">Redo</th>
                <td class="whitespace-nowrap text-right text-neutral-500">Ctrl+Y</td>
                <td data-shortcut-separator aria-hidden="true" class="px-2 text-center text-neutral-400">/</td>
                <td class="whitespace-nowrap text-neutral-500">⌘Y</td>
              </tr>
              <tr>
                <td class="whitespace-nowrap text-right text-neutral-500">Ctrl+Shift+Z</td>
                <td data-shortcut-separator aria-hidden="true" class="px-2 text-center text-neutral-400">/</td>
                <td class="whitespace-nowrap text-neutral-500">⇧⌘Z</td>
              </tr>
              <tr>
                <th scope="row" class="pr-4 text-left font-normal">Delete</th>
                <td class="whitespace-nowrap text-right text-neutral-500">Delete</td>
                <td data-shortcut-separator aria-hidden="true" class="px-2 text-center text-neutral-400">/</td>
                <td class="whitespace-nowrap text-neutral-500">⌫</td>
              </tr>
              <tr>
                <th scope="row" class="pr-4 text-left font-normal">Clear selection / marker</th>
                <td class="whitespace-nowrap text-right text-neutral-500">Esc</td>
                <td data-shortcut-separator aria-hidden="true" class="px-2 text-center text-neutral-400">/</td>
                <td class="whitespace-nowrap text-neutral-500">Esc</td>
              </tr>
            </tbody>
          </table>
        </div>
      </dialog>
      <button
      id="exportButton"
      class="absolute top-16 right-10 bg-sky-500 hover:bg-sky-600 active:bg-purple-500 border-2 border-sky-700 hover:border-purple-500 active:border-purple-700 text-white font-semibold h-8 px-1 rounded-sm shadow-2xl active:shadow-none"
      >
        Export to QASM
      </button>
      <div
        id="editor-notification"
        role="status"
        aria-live="polite"
        class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-500 opacity-0 shadow-lg transition-opacity duration-200"
      ></div>
      <!-- Share Modal will be loaded here by JavaScript -->
      <div id="share-modal-container"></div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
